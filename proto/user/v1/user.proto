syntax = "proto3";

package user;


option go_package = "github.com/fastscripts/grpctest;user";

service User {
    rpc GetUserByID(UserIDRequest) returns (UserResponse);
}

message UserIDRequest {
    int64 user_id = 1;
}

message UserResponse {
    int64 id = 1;
    string name = 2;
    string email = 3;
}